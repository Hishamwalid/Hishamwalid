<svg xmlns="http://www.w3.org/2000/svg" width="760" height="120" viewBox="0 0 760 120" role="img" aria-label="Learning the systems. Understanding the risks. Building toward cybersecurity.">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B0E0E6"/>
      <stop offset="100%" stop-color="#F2C0CB"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; }
      .soft { animation: soft 7s ease-in-out infinite; }
      @keyframes soft { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g class="soft">
    <text x="380" y="52" text-anchor="middle" class="sans" font-size="20" font-weight="500" fill="url(#fg)">Learning the systems. Understanding the risks.</text>
    <text x="380" y="80" text-anchor="middle" class="sans" font-size="20" font-weight="500" fill="url(#fg)" opacity="0.9">Building toward cybersecurity.</text>
  </g>

  <line x1="290" y1="96" x2="470" y2="96" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" opacity="0.45"/>

  <text x="380" y="112" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="2.5" fill="#8A8A8E">BAUET &#183; CSE &#183; AKRASIA</text>
</svg>