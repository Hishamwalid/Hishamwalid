<svg xmlns="http://www.w3.org/2000/svg" width="760" height="120" viewBox="0 0 760 120" role="img" aria-label="Learning the systems. Understanding the risks. Building toward cybersecurity.">
  <defs>
    <linearGradient id="fgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; }
      .breathe { animation: breathe 4s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="760" height="120" rx="10" fill="url(#fglow)"/>

  <g class="breathe">
    <text x="380" y="52" text-anchor="middle" class="sans" font-size="20" font-weight="600" fill="url(#fgrad)">
      Learning the systems. Understanding the risks.
    </text>
    <text x="380" y="80" text-anchor="middle" class="sans" font-size="20" font-weight="600" fill="url(#fgrad)" opacity="0.85">
      Building toward cybersecurity.
    </text>
  </g>

  <line x1="280" y1="96" x2="480" y2="96" stroke="url(#fgrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <text x="380" y="112" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#8b949e">
    BAUET &#183; CSE &#183; AKRASIA
  </text>
</svg>