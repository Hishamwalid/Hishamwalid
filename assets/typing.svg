<svg xmlns="http://www.w3.org/2000/svg" width="760" height="42" viewBox="0 0 760 42" role="img" aria-label="CSE student at BAUET. Leading a NASA Space Apps 2026 team. Shipping real products, not just assignments. Building toward cybersecurity.">
  <style>
    .mono { font-family: 'Consolas', 'SF Mono', 'Courier New', monospace; }
    .line { opacity: 0; animation: cycle 16s infinite; }
    @keyframes cycle {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      20%  { opacity: 1; }
      23%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .caret { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <text x="0" y="27" class="mono" font-size="16" fill="#B0E0E6">&gt;</text>

  <g class="line" style="animation-delay:0s">
    <text x="16" y="27" class="mono" font-size="16" fill="#E8E8EA">CSE student at BAUET.</text>
    <rect x="206" y="12" width="8" height="19" fill="#F2C0CB" class="caret"/>
  </g>

  <g class="line" style="animation-delay:4s">
    <text x="16" y="27" class="mono" font-size="16" fill="#E8E8EA">Leading a NASA Space Apps 2026 team.</text>
    <rect x="329" y="12" width="8" height="19" fill="#F2C0CB" class="caret"/>
  </g>

  <g class="line" style="animation-delay:8s">
    <text x="16" y="27" class="mono" font-size="16" fill="#E8E8EA">Shipping real products, not just assignments.</text>
    <rect x="408" y="12" width="8" height="19" fill="#F2C0CB" class="caret"/>
  </g>

  <g class="line" style="animation-delay:12s">
    <text x="16" y="27" class="mono" font-size="16" fill="#E8E8EA">Building toward cybersecurity.</text>
    <rect x="276" y="12" width="8" height="19" fill="#F2C0CB" class="caret"/>
  </g>
</svg>