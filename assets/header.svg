<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Hisham Walid - Computer Science and Engineering student at BAUET, NASA Space Apps Challenge 2026 team lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="55%" stop-color="#0D0D0F"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#B0E0E6"/>
      <stop offset="100%" stop-color="#F2C0CB"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#B0E0E6"/>
      <stop offset="100%" stop-color="#F2C0CB"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SF Mono', Menlo, monospace; }
      .drift { animation: drift 14s ease-in-out infinite; }
      @keyframes drift { 0%,100% { opacity: 0.5; } 50% { opacity: 0.9; } }
    </style>
  </defs>

  <rect width="900" height="290" fill="url(#bg)"/>
  <rect width="900" height="290" fill="url(#grid)"/>

  <!-- top rule -->
  <rect x="0" y="0" width="900" height="3" fill="url(#rule)" opacity="0.85"/>

  <!-- kicker -->
  <text x="450" y="72" text-anchor="middle" class="mono" font-size="13" letter-spacing="4.5" fill="#A8D5BA">HELLO, I&#8217;M</text>

  <!-- name -->
  <text x="450" y="140" text-anchor="middle" class="sans" font-size="58" font-weight="600" letter-spacing="6" fill="url(#nameGrad)">HISHAM WALID</text>

  <!-- divider -->
  <rect x="340" y="162" width="220" height="1" fill="#FFFFFF" opacity="0.16"/>

  <!-- role -->
  <text x="450" y="196" text-anchor="middle" class="sans" font-size="16" fill="#E8E8EA">Computer Science &amp; Engineering &#183; Bangladesh Army University of Engineering &amp; Technology</text>

  <text x="450" y="220" text-anchor="middle" class="sans" font-size="14" fill="#8A8A8E">Learning the systems. Understanding the risks. Building toward cybersecurity.</text>

  <!-- pills -->
  <g class="sans" font-size="12" text-anchor="middle">
    <rect x="139" y="240" width="170" height="30" rx="15" fill="#131316" stroke="#B0E0E6" stroke-opacity="0.35"/>
    <text x="224" y="259" fill="#B0E0E6" letter-spacing="1">CSE UNDERGRADUATE</text>

    <rect x="323" y="240" width="284" height="30" rx="15" fill="#131316" stroke="#A8D5BA" stroke-opacity="0.35"/>
    <text x="465" y="259" fill="#A8D5BA" letter-spacing="1">NASA SPACE APPS 2026 &#183; TEAM LEAD</text>

    <rect x="621" y="240" width="140" height="30" rx="15" fill="#131316" stroke="#F2C0CB" stroke-opacity="0.35"/>
    <text x="691" y="259" fill="#F2C0CB" letter-spacing="1">AKRASIA TEAM</text>
  </g>

  <!-- quiet corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.14" fill="none" stroke-width="1.5">
    <path d="M 18 18 L 18 42 M 18 18 L 42 18"/>
    <path d="M 882 18 L 882 42 M 882 18 L 858 18"/>
    <path d="M 18 272 L 18 248 M 18 272 L 42 272"/>
    <path d="M 882 272 L 882 248 M 882 272 L 858 272"/>
  </g>
</svg>