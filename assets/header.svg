<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Hisham Walid - Computer Science and Engineering student at BAUET, NASA Space Apps Challenge 2026 team lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#10151d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="45%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#58a6ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SF Mono', Menlo, monospace; }
      .shine { animation: sweep 5s linear infinite; }
      @keyframes sweep {
        0%   { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    </style>
  </defs>

  <rect width="900" height="290" fill="url(#bg)"/>
  <rect width="900" height="290" fill="url(#grid)"/>
  <rect width="900" height="290" fill="url(#glow)"/>

  <!-- sweeping highlight -->
  <g class="shine" opacity="0.5">
    <rect x="0" y="0" width="160" height="290" fill="url(#shine)" opacity="0.07"/>
  </g>

  <!-- top accent bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#nameGrad)"/>

  <!-- kicker -->
  <text x="450" y="72" text-anchor="middle" class="mono" font-size="13" letter-spacing="4" fill="#8b949e">
    HELLO, I&#8217;M
  </text>

  <!-- name -->
  <text x="450" y="140" text-anchor="middle" class="sans" font-size="58" font-weight="700" letter-spacing="6" fill="url(#nameGrad)">
    HISHAM WALID
  </text>

  <!-- divider -->
  <rect x="335" y="162" width="230" height="2" rx="1" fill="#30363d"/>

  <!-- role -->
  <text x="450" y="196" text-anchor="middle" class="sans" font-size="16" fill="#c9d1d9">
    Computer Science &amp; Engineering &#183; Bangladesh Army University of Engineering &amp; Technology
  </text>

  <text x="450" y="220" text-anchor="middle" class="sans" font-size="14" fill="#8b949e">
    Learning the systems. Understanding the risks. Building toward cybersecurity.
  </text>

  <!-- pills -->
  <g class="sans" font-size="12.5" text-anchor="middle">
    <rect x="122" y="240" width="176" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="210" y="259" fill="#58a6ff" letter-spacing="1">CSE UNDERGRADUATE</text>

    <rect x="310" y="240" width="280" height="30" rx="15" fill="#161b22" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="450" y="259" fill="#3fb950" letter-spacing="1">NASA SPACE APPS 2026 &#183; TEAM LEAD</text>

    <rect x="602" y="240" width="176" height="30" rx="15" fill="#161b22" stroke="#bc8cff" stroke-opacity="0.6"/>
    <text x="690" y="259" fill="#bc8cff" letter-spacing="1">AKRASIA TEAM</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#58a6ff" stroke-opacity="0.35" fill="none" stroke-width="2">
    <path d="M 16 16 L 16 44 M 16 16 L 44 16"/>
    <path d="M 884 16 L 884 44 M 884 16 L 856 16"/>
    <path d="M 16 274 L 16 246 M 16 274 L 44 274"/>
    <path d="M 884 274 L 884 246 M 884 274 L 856 274"/>
  </g>
</svg>