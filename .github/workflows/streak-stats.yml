# Auto-generates the stats card into profile/streak.svg once a day.
# Uses YOUR personal token so the contribution calendar includes private-repo work.
# Setup (one time):
#   1. Create a PAT with `repo` scope: https://github.com/settings/tokens
#   2. Add it as a repo secret named STREAK_STATS_TOKEN:
#      https://github.com/Hishamwalid/Hishamwalid/settings/secrets/actions
# Without the secret this still runs, but only counts PUBLIC contributions.

name: Update stats card

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak / total-contributions card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          # MUST stay on one line with no space after any "&".
          # A folded YAML block joins lines with spaces, which corrupts
          # every parameter after the first one (streak-stats returns an
          # "Invalid timezone" SVG instead of failing loudly).
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&border_radius=8&background=0d1117&ring=3fb950&fire=58a6ff&currStreakNum=3fb950&sideNums=bc8cff&sideLabels=8b949e&dates=6e7681&locale=en&timezone=Asia/Dhaka&starting_year=2024&card_width=520&card_height=220
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --staged --quiet; then
            echo "No change - card already current."
            exit 0
          fi
          git commit -m "chore: refresh stats card"
          git push